[project]
name = "mj-fte"
version = "0.1.0"
description = "MJ FTE - CLI System Analyst & Cleaner for Windows"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MJ" }]
requires-python = ">=3.12"
keywords = ["cli", "system-cleaner", "windows", "junk-files", "disk-usage", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.141.1",
    "openrouter>=1.1.71",
    "rich>=15.0.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.30.0",
    "google-api-python-client>=2.100.0",
    "keyring>=25.0.0",
    "send2trash>=1.8.0",
    "psutil>=5.9.0",
    "pywin32>=306",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
]
[project.scripts]
mj = "mj.__main__:main"

[project.urls]
Homepage = "https://github.com/syed-mujtaba-stack/mj-fte"
Repository = "https://github.com/syed-mujtaba-stack/mj-fte"
Issues = "https://github.com/syed-mujtaba-stack/mj-fte/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["mj"]